[package]
name = "poler-reader"
description = "POLER Reader: living-voice book synthesizer - rotor resonator (J=A-At), trit slit {-1,0,+1}, coarticulation glides, .poler-book format - zero external dependencies"
version.workspace = true
edition.workspace = true
# POLER SAML v1.0 (unification 2026-10-22): явно, без workspace-наследования —
# пермиссивное "MIT" в метаданных противоречило коммерческой модели.
license-file = "../../LICENSE.md"
repository.workspace = true
authors.workspace = true
keywords = ["tts", "living-voice", "rotor", "resonator", "audiobook"]
categories = ["multimedia::audio", "science"]

[lib]
name = "poler_reader"
path = "src/lib.rs"

[[bin]]
name = "poler-reader"
path = "src/main.rs"
